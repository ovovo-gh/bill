<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172e2a"><meta name="description" content="个人资产余额看板，管理多币种账户、信用卡欠款与余额历史。"><meta name="referrer" content="no-referrer">
<title>资产清单 · 我的资产</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./overrides.css"><script type="module" src="./app.js"></script>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="3"/><path d="M9 3v18M12 8h5M12 12h5M12 16h3M3 8h3M3 16h3"/></svg></span><span>资产清单</span></div><div class="header-actions"><span class="local-badge">本地账本</span><button id="settings-button" class="backup-button">备份与恢复 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg></button></div></header>
<main>
<div class="page-heading"><div><div class="eyebrow" id="today"></div><h1>我的资产</h1></div><button id="add-button" class="primary"><span aria-hidden="true">＋</span> 添加账户</button></div>
<section class="overview" aria-label="资产总览"><div class="net-block"><div class="overview-label">净资产 <span class="currency-chip">CNY</span><button id="privacy-button" class="privacy-button" aria-label="隐藏金额"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="net-value" id="net-value">¥ 0.00</div><div class="overview-foot">所有余额折合人民币，扣除欠款</div></div><div class="summary-block"><span class="summary-icon asset">↗</span><span>总资产</span><strong id="assets-value">¥ 0.00</strong></div><div class="summary-block"><span class="summary-icon debt">↘</span><span>总负债</span><strong id="debt-value">¥ 0.00</strong></div></section>
<div class="status-strip"><span id="local-status" role="status">自动保存到此浏览器</span><button id="refresh-rates" class="text-button">更新汇率 ↻</button></div>
<div id="rate-notice" class="notice" hidden></div>
<section class="workspace"><div class="section-top"><nav class="tabs" aria-label="账本视图"><button data-view="accounts" class="active">账户 <span id="account-count">0</span></button><button data-view="history">修改历史</button><button data-view="archived">已归档</button></nav><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索账户或备注" aria-label="搜索账户或备注"></label></div><div class="filter-bar"><div id="filters" class="filters"></div><label id="sort-control" class="sort-control">排序<select id="sort-order" aria-label="账户金额排序"><option value="desc">金额从高到低</option><option value="asc">金额从低到高</option></select></label></div><div id="content"></div></section>
<footer><span>数据仅保存在当前浏览器 · 建议定期导出备份</span><span id="rates-caption">外币按每日参考汇率估算</span></footer>
</main>
<dialog id="account-dialog"><form id="account-form"><div class="dialog-heading"><h2 id="account-title">添加账户</h2><button type="button" class="close" data-close aria-label="关闭">×</button></div><input type="hidden" name="id"><label>账户名称<input name="name" maxlength="40" placeholder="例如：微信余额、日元零钱" required></label><div class="form-row"><label>账户类型<select name="kind"><option value="asset">资产账户</option><option value="debt">信用卡 / 负债</option></select></label><label>币种<select name="currency"><option value="CNY">CNY · 人民币</option><option value="HKD">HKD · 港币</option><option value="JPY">JPY · 日元</option><option value="EUR">EUR · 欧元</option></select></label></div><label id="amount-label">当前余额<input name="amount" inputmode="decimal" placeholder="0.00" required autocomplete="off"></label><div class="form-row"><label>分类<input name="category" list="categories" maxlength="30" placeholder="可输入自定义分类" required><datalist id="categories"></datalist></label><label>卡片颜色<select name="color"><option value="blue">海蓝</option><option value="green">翡翠</option><option value="orange">琥珀</option><option value="purple">紫罗兰</option><option value="rose">玫瑰</option></select></label></div><label>账户备注<input name="note" maxlength="200" placeholder="选填，例如：工资卡尾号 1234"></label><label id="change-note-label">本次修改说明<input name="changeNote" maxlength="200" placeholder="选填，例如：与实际余额核对"></label><p class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close class="secondary">取消</button><button type="submit" class="primary">保存账户</button></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>备份与恢复</h2><button data-close class="close" aria-label="关闭">×</button></div><p class="muted">账户和修改历史仅保存在当前浏览器。导出一份备份，可以在清理浏览器或更换设备前保存账目。</p><button id="export-button" class="secondary full">导出备份文件</button><label class="secondary full file-label">从备份文件恢复<input id="import-file" type="file" accept=".json,application/json"></label><p class="field-help">备份文件包含账户名称、余额和历史记录，请妥善保管。恢复前会先自动导出当前账本。</p></dialog>
<dialog id="confirm-dialog"><div class="dialog-heading"><h2 id="confirm-title"></h2></div><p id="confirm-message" class="muted"></p><div class="dialog-actions"><button id="confirm-cancel" class="secondary">取消</button><button id="confirm-ok" class="primary">确认</button></div></dialog>
<div id="toast" role="status" class="toast" hidden></div>
<noscript>请启用 JavaScript 以使用资产清单。</noscript>
</body></html>
