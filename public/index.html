<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172b4d"><meta name="description" content="个人资产余额看板，管理多币种账户、信用卡欠款与余额历史。"><meta name="referrer" content="no-referrer">
<title>余有 · 我的资产</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23172b4d'/%3E%3Cpath d='M10 12h20v17H10z' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M23 18h10v7H23z' fill='%236bd6bd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">余</span><span>余有<span class="brand-sub">个人资产簿</span></span></div><div class="header-actions"><button id="sync-button" class="text-button">同步设置</button><button id="settings-button" class="icon-button" aria-label="数据与备份">⚙</button></div></header>
<main>
<div class="page-heading"><div><div class="eyebrow" id="today"></div><h1>我的资产</h1></div><button id="add-button" class="primary"><span aria-hidden="true">＋</span> 添加账户</button></div>
<section class="overview" aria-label="资产总览"><div class="net-block"><div class="overview-label">净资产 <span class="currency-chip">CNY</span><button id="privacy-button" class="privacy-button" aria-label="隐藏金额">◉</button></div><div class="net-value" id="net-value">¥ 0.00</div><div class="overview-foot">所有账户折合人民币 · 已扣除负债</div></div><div class="overview-details"><div><span>总资产</span><strong id="assets-value">¥ 0.00</strong></div><div><span>总负债</span><strong id="debt-value">¥ 0.00</strong></div></div></section>
<div class="status-strip"><span id="sync-status" role="status">仅此设备 · 未连接同步</span><button id="refresh-rates" class="text-button">更新汇率 ↻</button></div>
<div id="rate-notice" class="notice" hidden></div>
<section class="workspace"><div class="section-top"><nav class="tabs" aria-label="账本视图"><button data-view="accounts" class="active">账户 <span id="account-count">0</span></button><button data-view="history">修改历史</button><button data-view="archived">已归档</button></nav><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索账户或备注" aria-label="搜索账户或备注"></label></div><div id="filters" class="filters"></div><div id="content"></div></section>
<footer><span>余额有数，心里有底。</span><span id="rates-caption">外币按每日参考汇率估算</span></footer>
</main>
<dialog id="account-dialog"><form id="account-form"><div class="dialog-heading"><h2 id="account-title">添加账户</h2><button type="button" class="close" data-close aria-label="关闭">×</button></div><input type="hidden" name="id"><label>账户名称<input name="name" maxlength="40" placeholder="例如：微信余额、日元零钱" required></label><div class="form-row"><label>账户类型<select name="kind"><option value="asset">资产账户</option><option value="debt">信用卡 / 负债</option></select></label><label>币种<select name="currency"><option value="CNY">CNY · 人民币</option><option value="HKD">HKD · 港币</option><option value="JPY">JPY · 日元</option><option value="EUR">EUR · 欧元</option></select></label></div><label id="amount-label">当前余额<input name="amount" inputmode="decimal" placeholder="0.00" required autocomplete="off"></label><div class="form-row"><label>分类<input name="category" list="categories" maxlength="30" placeholder="可输入自定义分类" required><datalist id="categories"></datalist></label><label>卡片颜色<select name="color"><option value="blue">海蓝</option><option value="green">翡翠</option><option value="orange">琥珀</option><option value="purple">紫罗兰</option><option value="rose">玫瑰</option></select></label></div><label>账户备注<input name="note" maxlength="200" placeholder="选填，例如：工资卡尾号 1234"></label><label id="change-note-label">本次修改说明<input name="changeNote" maxlength="200" placeholder="选填，例如：与实际余额核对"></label><p class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close class="secondary">取消</button><button type="submit" class="primary">保存账户</button></div></form></dialog>
<dialog id="sync-dialog"><form id="sync-form"><div class="dialog-heading"><h2>跨设备同步</h2><button type="button" data-close class="close" aria-label="关闭">×</button></div><p class="muted">手机和电脑使用同一个同步密钥，即可打开同一本资产簿。</p><label>同步服务地址<input name="endpoint" type="url" placeholder="https://your-worker.workers.dev"></label><p class="field-help">部署完成后会自动填好。未连接前，修改仅保存在此设备。</p><label>同步密钥<input name="key" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 64 位同步密钥"></label><div class="inline-actions"><button id="generate-key" type="button" class="secondary">生成新密钥</button><button id="copy-key" type="button" class="text-button">复制密钥</button><button id="show-key" type="button" class="text-button">显示</button></div><p class="field-help">密钥相当于账本钥匙，请自己妥善保存。更换密钥会打开另一份账本。云端只保存加密后的内容。</p><p class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close class="secondary">暂不连接</button><button type="submit" class="primary">连接并同步</button></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>数据与备份</h2><button data-close class="close" aria-label="关闭">×</button></div><p class="muted">备份包含全部账户和修改历史，以同步密钥加密。</p><button id="export-button" class="secondary full">导出加密备份</button><label class="secondary full file-label">恢复加密备份<input id="import-file" type="file" accept=".json,application/json"></label><p class="field-help">恢复前先导出当前账本。恢复不会更换密钥，也不会自动合并其他账本。</p><button id="settings-sync" class="text-button">管理同步密钥 →</button></dialog>
<dialog id="confirm-dialog"><div class="dialog-heading"><h2 id="confirm-title"></h2></div><p id="confirm-message" class="muted"></p><div class="dialog-actions"><button id="confirm-cancel" class="secondary">取消</button><button id="confirm-ok" class="primary">确认</button></div></dialog>
<div id="toast" role="status" class="toast" hidden></div>
<noscript>请启用 JavaScript 以使用个人资产簿。</noscript>
</body></html>
